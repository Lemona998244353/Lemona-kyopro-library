name: Verify library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification tools
        run: python -m pip install online-judge-verify-helper 'setuptools==81.0.0'

      - name: Run verification
        run: oj-verify run
